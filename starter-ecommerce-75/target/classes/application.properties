spring.application.name=starter-ecommerce-75
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommers_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:StarterEcommerceJwtSecretKeyChangeThisBeforeProduction1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.upload-dir=${UPLOAD_DIR:uploads/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
